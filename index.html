<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRuta | Sistema de Transporte Lima</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-white flex h-screen overflow-hidden">

    <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-[1000] shadow-2xl">
        <div class="p-6 bg-blue-700 font-black text-2xl italic tracking-tighter flex items-center gap-2">
            <span class="bg-white text-blue-700 px-2 py-0.5 rounded-md">UR</span>
            UNIRUTA
        </div>
        <div class="p-4 bg-slate-800/50">
            <input type="text" id="buscador" placeholder="Busca tu ruta en UniRuta..." 
                   class="w-full p-3 bg-slate-950 rounded-xl outline-none border border-slate-700 focus:border-blue-500 transition-all text-sm">
        </div>
        <div id="lista-buses" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll">
            </div>
    </aside>

    <main class="flex-1 relative">
        <div id="mapa" class="h-full w-full"></div>
        
        <div id="panel" class="absolute bottom-8 left-8 bg-slate-900/95 backdrop-blur p-6 rounded-3xl border border-blue-500 hidden z-[999] shadow-2xl">
            <h2 id="p-titulo" class="text-3xl font-black italic"></h2>
            <div id="p-desc" class="text-slate-400 mt-2 text-xs uppercase font-bold tracking-widest"></div>
            <div class="mt-4 flex gap-2">
                <span class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-[10px] font-bold uppercase">UniRuta Oficial</span>
                <span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-[10px] font-bold italic">S/ 1.50</span>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
